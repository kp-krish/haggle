version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22 && nvm use 22
            - npm ci
        build:
          commands:
            - nvm use 22
            # Amplify's Next.js server only sees env vars written into .env.production
            # at build time; the values come from the app's environment variables.
            - env | grep -E '^(AUTH_|DISCORD_GUILD_ID=|HAGGLE_)' >> .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
