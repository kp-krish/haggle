version = 0.1

# The AWS organization only allows us-east-2, so the region is pinned here rather than
# taken from the CLI default.
[default.global.parameters]
stack_name = "haggle-dev"
region = "us-east-2"

[default.build.parameters]
cached = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
s3_prefix = "haggle-dev"
parameter_overrides = "Stage=dev AlertEmail=kpofficial2004@gmail.com"
tags = "project=haggle stage=dev"
