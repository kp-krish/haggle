AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Haggle - agents that bargain for you (Discord + AWS)

Parameters:
  Stage:
    Type: String
    Default: dev
  AlertEmail:
    Type: String
    Description: Where budget and alarm emails go
  TextModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
  VisionModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    MemorySize: 256
    Timeout: 10
    Tracing: Active
    Layers: [!Ref DepsLayer]
    Environment:
      Variables:
        STAGE: !Ref Stage
        USERS_TABLE: !Ref UsersTable
        LISTINGS_TABLE: !Ref ListingsTable
        WANTS_TABLE: !Ref WantsTable
        DEALS_TABLE: !Ref DealsTable
        OFFERS_TABLE: !Ref OffersTable
        PLACES_TABLE: !Ref PlacesTable
        PHOTOS_BUCKET: !Ref PhotosBucket
        LIMITS_KEY_ID: !Ref LimitsKey
        DISCORD_SECRET_ARN: !Ref DiscordSecret
        TEXT_MODEL_ID: !Ref TextModelId
        VISION_MODEL_ID: !Ref VisionModelId

Resources:
  # Third-party packages, prebuilt for Linux by scripts/build_layer.py.
  DepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: .layers/deps/
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [x86_64]

  # ---------- API + interactions endpoint ----------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  InteractionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: interactions.handler
      Description: Discord interactions endpoint (signature check, routing)
      Events:
        Discord:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /interactions
            Method: POST
      Environment:
        Variables:
          WORKER_FUNCTION: !Ref ListingAgentFunction
          STATE_MACHINE_ARN: !Ref NegotiationStateMachine
          DEALS_FUNCTION: !Ref DealsFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DiscordSecret
            # Can lock a limit away, cannot read one back.
            - Effect: Allow
              Action: kms:Encrypt
              Resource: !GetAtt LimitsKey.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ListingsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WantsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref DealsTable }
        - LambdaInvokePolicy: { FunctionName: !Ref ListingAgentFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref DealsFunction }
        - Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
                - states:SendTaskSuccess
                - states:SendTaskFailure
              Resource: !Ref NegotiationStateMachine
            - Effect: Allow
              Action: states:StopExecution
              Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:haggle-${Stage}-negotiation:*

  # ---------- Website API ----------
  # Called only by the Next.js server, with HMAC-signed requests naming the user.
  WebApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: web_api.handler
      Description: Website API (browse, sell, interest, my deals)
      Timeout: 15
      Environment:
        Variables:
          WEB_SECRET_ARN: !Ref WebSecret
          WORKER_FUNCTION: !Ref ListingAgentFunction
          DEALS_FUNCTION: !Ref DealsFunction
      Events:
        Web:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /web/{proxy+}
            Method: ANY
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref WebSecret
                - !Ref DiscordSecret
            # Locks limits away; cannot read them back.
            - Effect: Allow
              Action: kms:Encrypt
              Resource: !GetAtt LimitsKey.Arn
            - Effect: Allow
              Action: states:StopExecution
              Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:haggle-${Stage}-negotiation:*
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ListingsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WantsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref DealsTable }
        - S3CrudPolicy: { BucketName: !Ref PhotosBucket }
        - LambdaInvokePolicy: { FunctionName: !Ref ListingAgentFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref DealsFunction }

  WebApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Website API is erroring
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WebApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # Shared by the web API and the Next.js server for request signing.
  WebSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub haggle/${Stage}/web
      Description: HMAC key the Next.js server signs website API requests with
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: hmac_secret
        PasswordLength: 64
        ExcludePunctuation: true

  # ---------- Negotiation ----------
  # One workflow per deal: offer turns, agreement, both students confirm.
  NegotiationStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub haggle-${Stage}-negotiation
      Type: STANDARD
      DefinitionUri: statemachine/negotiation.asl.json
      DefinitionSubstitutions:
        SellerNegotiatorArn: !GetAtt SellerNegotiatorFunction.Arn
        BuyerNegotiatorArn: !GetAtt BuyerNegotiatorFunction.Arn
        DealsFunctionArn: !GetAtt DealsFunction.Arn
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref SellerNegotiatorFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref BuyerNegotiatorFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref DealsFunction }

  # Same code, two roles. Each may decrypt only its own side's limits: the KMS
  # encryption context names the record ("listing#..." or "want#...").
  SellerNegotiatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: negotiator.handler
      Description: Seller's agent - decrypts only seller floors
      Timeout: 60
      Environment:
        Variables:
          SIDE: seller
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DiscordSecret
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - arn:aws:bedrock:*::foundation-model/*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt LimitsKey.Arn
              Condition:
                StringLike:
                  kms:EncryptionContext:record: "listing#*"
                StringEquals:
                  kms:EncryptionContext:purpose: price-limit
        - DynamoDBReadPolicy: { TableName: !Ref ListingsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref DealsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref OffersTable }

  BuyerNegotiatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: negotiator.handler
      Description: Buyer's agent - decrypts only buyer ceilings
      Timeout: 60
      Environment:
        Variables:
          SIDE: buyer
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DiscordSecret
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - arn:aws:bedrock:*::foundation-model/*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt LimitsKey.Arn
              Condition:
                StringLike:
                  kms:EncryptionContext:record: "want#*"
                StringEquals:
                  kms:EncryptionContext:purpose: price-limit
            # Final ask: ends its own wait when there is nothing worth asking.
            - Effect: Allow
              Action: states:SendTaskFailure
              Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:haggle-${Stage}-negotiation
        - DynamoDBReadPolicy: { TableName: !Ref WantsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref DealsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref OffersTable }

  # Deal lifecycle around the turns. No KMS access.
  DealsFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Fixed name so the scheduler role can reference it without a dependency cycle.
      FunctionName: !Sub haggle-${Stage}-deals
      CodeUri: src/
      Handler: deals.handler
      Description: Opens, schedules, confirms, finalises and follows up on deals
      Timeout: 30
      Environment:
        Variables:
          SCHEDULER_ROLE_ARN: !GetAtt FollowupSchedulerRole.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DiscordSecret
            - Effect: Allow
              Action: states:StopExecution
              Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:haggle-${Stage}-negotiation:*
            - Effect: Allow
              Action: scheduler:CreateSchedule
              Resource: !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/deal_*
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt FollowupSchedulerRole.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref DealsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ListingsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WantsTable }

  # EventBridge Scheduler uses this to call the deals function for reminders/handoffs.
  FollowupSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-deals
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:haggle-${Stage}-deals

  NegotiationFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Negotiation workflows are failing
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref NegotiationStateMachine
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # Pairs listings and wants as they open. Public fields only; no KMS access.
  MatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: matcher.handler
      Description: Matches new listings with open wants and asks the buyer
      Timeout: 30
      Events:
        ListingOpened:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt ListingsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumRetryAttempts: 2
            BisectBatchOnFunctionError: true
            FilterCriteria:
              Filters:
                - Pattern: '{"dynamodb": {"NewImage": {"status": {"S": ["open"]}}}}'
        WantOpened:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt WantsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumRetryAttempts: 2
            BisectBatchOnFunctionError: true
            FilterCriteria:
              Filters:
                - Pattern: '{"dynamodb": {"NewImage": {"status": {"S": ["open"]}}}}'
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DiscordSecret
        - DynamoDBReadPolicy: { TableName: !Ref ListingsTable }
        - DynamoDBReadPolicy: { TableName: !Ref WantsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref DealsTable }

  MatcherErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Matcher is erroring
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref MatcherFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # Slow work behind deferred replies: photo, Bedrock, posting. No KMS access at all.
  ListingAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: listing_agent.handler
      Description: Writes listings from photos, classifies wants, publishes
      MemorySize: 1024
      Timeout: 60
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref NegotiationStateMachine
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DiscordSecret
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - arn:aws:bedrock:*::foundation-model/*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ListingsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WantsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref DealsTable }
        - S3CrudPolicy: { BucketName: !Ref PhotosBucket }
        - Statement:
            # Website "Interested" starts a negotiation.
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Ref NegotiationStateMachine
            # Extra pickup windows resume the waiting negotiation workflow.
            - Effect: Allow
              Action: states:SendTaskSuccess
              Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:haggle-${Stage}-negotiation
      EventInvokeConfig:
        MaximumRetryAttempts: 0

  ListingAgentErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Listing agent is erroring
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ListingAgentFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  InteractionsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Discord interactions handler is erroring
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref InteractionsFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # ---------- Data ----------
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: user_id, AttributeType: S }
      KeySchema:
        - { AttributeName: user_id, KeyType: HASH }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  ListingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: listing_id, AttributeType: S }
        - { AttributeName: category, AttributeType: S }
        - { AttributeName: seller_id, AttributeType: S }
        - { AttributeName: created_at, AttributeType: S }
        - { AttributeName: status, AttributeType: S }
      KeySchema:
        - { AttributeName: listing_id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: by_category
          KeySchema:
            - { AttributeName: category, KeyType: HASH }
            - { AttributeName: created_at, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: by_seller
          KeySchema:
            - { AttributeName: seller_id, KeyType: HASH }
            - { AttributeName: created_at, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        # Website browsing: open listings, newest first.
        - IndexName: by_status
          KeySchema:
            - { AttributeName: status, KeyType: HASH }
            - { AttributeName: created_at, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      StreamSpecification: { StreamViewType: NEW_AND_OLD_IMAGES }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  WantsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: want_id, AttributeType: S }
        - { AttributeName: category, AttributeType: S }
        - { AttributeName: buyer_id, AttributeType: S }
        - { AttributeName: created_at, AttributeType: S }
      KeySchema:
        - { AttributeName: want_id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: by_category
          KeySchema:
            - { AttributeName: category, KeyType: HASH }
            - { AttributeName: created_at, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: by_buyer
          KeySchema:
            - { AttributeName: buyer_id, KeyType: HASH }
            - { AttributeName: created_at, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      StreamSpecification: { StreamViewType: NEW_AND_OLD_IMAGES }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  # A deal has two participants, so "deals by user" is one index per side.
  DealsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: deal_id, AttributeType: S }
        - { AttributeName: seller_id, AttributeType: S }
        - { AttributeName: buyer_id, AttributeType: S }
        - { AttributeName: listing_id, AttributeType: S }
        - { AttributeName: created_at, AttributeType: S }
      KeySchema:
        - { AttributeName: deal_id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: by_seller
          KeySchema:
            - { AttributeName: seller_id, KeyType: HASH }
            - { AttributeName: created_at, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: by_buyer
          KeySchema:
            - { AttributeName: buyer_id, KeyType: HASH }
            - { AttributeName: created_at, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: by_listing
          KeySchema:
            - { AttributeName: listing_id, KeyType: HASH }
            - { AttributeName: created_at, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  OffersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: deal_id, AttributeType: S }
        - { AttributeName: round_side, AttributeType: S }
      KeySchema:
        - { AttributeName: deal_id, KeyType: HASH }
        - { AttributeName: round_side, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  PlacesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: place_id, AttributeType: S }
      KeySchema:
        - { AttributeName: place_id, KeyType: HASH }

  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-photos-after-move-out
            Status: Enabled
            ExpirationInDays: 180
          # Raw website uploads; the listing agent stores a resized copy under photos/.
          - Id: expire-raw-uploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1
      CorsConfiguration:
        CorsRules:
          # Browsers upload photos straight to S3 with a presigned POST.
          - AllowedMethods: [POST]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            MaxAge: 3000

  # ---------- Secrets + encryption ----------
  # Private floor/ceiling prices are encrypted field by field with this key.
  # Only negotiator functions get kms:Decrypt (added in a later phase).
  LimitsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Haggle private price limits
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdmin
            Effect: Allow
            Principal: { AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root" }
            Action: kms:*
            Resource: "*"

  LimitsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/haggle-${Stage}-limits
      TargetKeyId: !Ref LimitsKey

  # Value is pushed from the local .env by scripts/push_secrets.py, never from git.
  DiscordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub haggle/${Stage}/discord
      Description: Discord app id, public key, bot token, server and channel ids

  # ---------- Monitoring ----------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub haggle-${Stage}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 25, Unit: USD }
        CostFilters:
          TagKeyValue: ["user:project$haggle"]
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 10
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlertEmail }
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 25
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlertEmail }

Outputs:
  InteractionsUrl:
    Description: Paste into Discord developer portal > Interactions Endpoint URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/interactions
  WebApiUrl:
    Description: Base URL the Next.js server calls (HAGGLE_API_URL)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  WebSecretArn:
    Value: !Ref WebSecret
  DiscordSecretArn:
    Value: !Ref DiscordSecret
  PhotosBucketName:
    Value: !Ref PhotosBucket
