[project]
name = "haggle"
version = "0.1.0"
description = "Agents that bargain for you: a Discord marketplace for students on AWS"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
